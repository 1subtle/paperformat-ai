name: PaperFormat CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.420
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore PaperFormat.sln --locked-mode
      - name: Generate untracked synthetic DOCX fixtures
        run: >-
          dotnet run
          --project tools/PaperFormat.Fixtures
          --configuration Release
          --no-restore
          --
          --output tests/fixtures/generated
      - run: dotnet build PaperFormat.sln --configuration Release --no-restore
      - run: dotnet test PaperFormat.sln --configuration Release --no-build
      - run: dotnet format PaperFormat.sln --verify-no-changes --no-restore
      - name: Verify Skill, venue catalog, and governed assets
        run: >-
          python3 -m unittest
          tests/agent_native_structure_test.py
          tests/venue_catalog_test.py
          tests/template_asset_test.py

  agent-native-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.420
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - run: dotnet restore PaperFormat.sln --locked-mode
      - name: Generate untracked synthetic DOCX fixtures
        run: >-
          dotnet run
          --project tools/PaperFormat.Fixtures
          --configuration Release
          --no-restore
          --
          --output tests/fixtures/generated
      - name: Install rendering dependencies
        run: sudo apt-get install --yes libreoffice-writer poppler-utils
      - name: Rehearse one-command CLI and Skill installation
        run: |
          ./scripts/install.sh \
            --prefix "$RUNNER_TEMP/paperformat-install" \
            --codex-home "$RUNNER_TEMP/codex-home"
          "$RUNNER_TEMP/paperformat-install/bin/paperformat" --help
          test -f "$RUNNER_TEMP/codex-home/skills/paperformat/SKILL.md"
      - name: Run complete Agent-Native IEEE release example
        run: >-
          node scripts/rehearse-agent-native-example.mjs
          --output "$RUNNER_TEMP/ieee-agent-native-example"
      - name: Verify Skill-native release structure
        run: >-
          python3 -m unittest
          tests/agent_native_structure_test.py
          tests/venue_catalog_test.py
          tests/template_asset_test.py
